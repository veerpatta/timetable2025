<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes, maximum-scale=5.0">
	<title>VPPS Timetable 2026-27 - Veer Patta Public School</title>
	<meta name="description" content="Class, teacher and substitution timetable for Veer Patta Public School, Amet - session 2026-27.">
	<meta name="theme-color" content="#f5f7fb">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta name="apple-mobile-web-app-title" content="VPPS 2026-27">
	<meta name="application-name" content="VPPS 2026-27">
	<meta name="mobile-web-app-capable" content="yes">

	<link rel="manifest" href="./manifest.webmanifest">
	<link rel="icon" type="image/png" href="./icons/icon-512.png">
	<link rel="apple-touch-icon" href="./icons/icon-512.png">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="./styles/app.css">

	<script>
		// Set the theme before first paint so the shell never flashes light.
		(function () {
			try {
				var saved = localStorage.getItem('vppsm_theme');
				var dark = saved
					? saved === 'dark'
					: window.matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
				if (dark) {
					document.querySelector('meta[name="theme-color"]').setAttribute('content', '#08111f');
				}
			} catch (error) { /* defaults to light */ }
		})();
	</script>
</head>
<body>
	<div class="loader" id="loader"><div class="loader__spinner" role="status" aria-label="Loading timetable"></div></div>

	<div class="page">
		<div class="shell">
			<header class="app-header">
				<div class="app-header__bar">
					<img class="app-header__logo" src="./icons/icon-512.png" alt="" width="38" height="38">
					<div class="app-header__copy">
						<h1 class="app-header__title" id="app-title">VPPS Timetable</h1>
						<div class="app-header__school" id="app-school">Veer Patta Public School, Amet</div>
					</div>
					<div class="app-header__actions">
						<button type="button" class="icon-button" id="lang-toggle" aria-label="Switch language">हिंदी</button>
						<button type="button" class="icon-button icon-button--square" id="theme-toggle" aria-label="Toggle dark mode"></button>
					</div>
				</div>
				<div class="status-strip">
					<span class="status-strip__dot" id="status-dot" aria-hidden="true"></span>
					<span class="status-strip__text" id="status-text" role="status"></span>
					<span class="status-strip__clock" id="status-clock"></span>
				</div>
			</header>

			<main class="app-main" id="app-main"></main>
		</div>
	</div>

	<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

	<nav class="app-nav" id="app-nav" aria-label="Primary navigation"></nav>

	<!--
		config.local.js is gitignored and may simply not exist. A 404 here is
		expected and harmless: the app then keeps every plan on this device.
	-->
	<script src="./scripts/config.local.js" onerror="void 0"></script>
	<script src="./scripts/data.js"></script>
	<script src="./scripts/i18n.js"></script>
	<script src="./scripts/substitution.js"></script>
	<script src="./scripts/sync.js"></script>
	<script src="./scripts/app.js"></script>

	<script>
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', function () {
				navigator.serviceWorker.register('./sw.js').catch(function (error) {
					console.warn('Service worker registration failed:', error);
				});
			});
		}
	</script>
</body>
</html>
